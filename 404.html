<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Slide Lines Privacy Policy</title>
<style>:root{--bg:#f6f8fc;--surface:#fff;--text:#1b2330;--muted:#566173;--line:#dde3ee;--accent:#1d64d8;--note-bg:#eef4ff;--note-line:#c9dafb;--warn-bg:#fff4e5;--warn-line:#f2c98b;--warn-text:#6b4200}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--surface:#161d28;--text:#e6ebf3;--muted:#a0abbd;--line:#2a3445;--accent:#78abff;--note-bg:#18243a;--note-line:#2c4369;--warn-bg:#3a2a12;--warn-line:#7a5a26;--warn-text:#ffdca8}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
body:lang(ja),body:lang(zh-CN),body:lang(ko){line-height:1.8}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{inset-inline-start:16px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:1}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 56px}
header{padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
header .app{margin:0;color:var(--muted);font-size:.95rem;font-weight:600}
h1{margin:4px 0 0;font-size:1.85rem;line-height:1.25}
nav.langs{margin:0 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
nav.langs h2{font-size:.85rem;margin:0 0 6px;color:var(--muted);text-transform:none;letter-spacing:0}
nav.langs ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
nav.langs a{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:.95rem;min-height:32px;line-height:22px}
nav.langs a:hover,nav.langs a:focus-visible{border-color:var(--accent)}
nav.langs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note,.warn{border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:.95rem}
.note{background:var(--note-bg);border:1px solid var(--note-line)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text)}
h2{font-size:1.25rem;margin:30px 0 8px;scroll-margin-top:12px}
h3{font-size:1.08rem;margin:20px 0 6px}
p,li{overflow-wrap:anywhere}
ul{padding-inline-start:1.4em;margin:8px 0}
li{margin:4px 0}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:start;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:auto}.table-wrap thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.table-wrap tbody tr{border-bottom:1px solid var(--line);padding:6px 0}.table-wrap tbody tr:last-child{border-bottom:0}.table-wrap td{border:0;padding:3px 14px}.table-wrap td::before{content:attr(data-label);display:block;font-weight:600;font-size:.82rem;color:var(--muted)}}
tbody tr:last-child td{border-bottom:0}
th{font-weight:600}
.pending{font-style:italic;color:var(--muted)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
@media print{nav.langs,.skip{display:none}body{background:#fff;color:#000}}</style>
</head>
<body>
<div class="wrap">
<header><p class="app">Slide Lines</p><h1>Page not found</h1></header>
<p>The page you asked for does not exist. The Slide Lines Privacy Policy is on the home page of this site, in every available language. <a href="https://ofirgorenapps.github.io/slidelines-privacy/">https://ofirgorenapps.github.io/slidelines-privacy/</a></p>
</div>
</body>
</html>
